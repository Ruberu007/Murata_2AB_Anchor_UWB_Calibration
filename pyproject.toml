[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uwb-calibration-tool"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "matplotlib>=3.8", "PySide6>=6.6"]

[tool.setuptools.packages.find]
include = ["uwb_cal*"]

[tool.pytest.ini_options]
testpaths = ["uwb_cal/tests"]
